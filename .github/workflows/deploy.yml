name: Derle, doğrula, yayınla

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# GitHub Pages'e yayın için gereken izinler
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; yeni push eskisini iptal etsin
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Doğrula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tarayıcıyı kur
        run: npx playwright install --with-deps chromium

      # Mermaid sözdizimi + tip kontrolü + derleme, ardından derlenmiş çıktıya
      # karşı gerçek tarayıcıda diyagram render'ı ve konsol temizliği.
      - name: Derle ve doğrula
        run: npm run verify

      - name: Çıktıyı sakla
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Yayınla
    # Yalnızca ana dala push'ta ve doğrulama geçtiyse
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
